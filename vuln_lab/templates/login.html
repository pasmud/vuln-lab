{% extends 'base.html' %}
{% block title %}Sign in{% endblock %}
{% block content %}
<h1>Sign in</h1>
<p>Use an account created from the local command line.</p>
{% if invalid %}<p class="error" role="alert">Username or password is incorrect.</p>{% endif %}
<form method="post" action="{{ url_for('notes.login') }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label for="username">Username</label>
  <input id="username" name="username" autocomplete="username" required maxlength="32">
  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password"
         required maxlength="128">
  <button>Sign in</button>
</form>
{% endblock %}
