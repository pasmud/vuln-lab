{% extends 'base.html' %}
{% block title %}Edit note{% endblock %}
{% block content %}
<h1>Edit note</h1>
<form method="post" action="{{ url_for('notes.edit_note', note_id=note['id']) }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label for="title">Title</label>
  <input id="title" name="title" required maxlength="{{ title_max }}" value="{{ note['title'] }}">
  <label for="body">Body</label>
  <textarea id="body" name="body" rows="6" required maxlength="{{ body_max }}">
{{ note['body'] }}</textarea>
  <button>Save changes</button>
</form>
<p><a href="{{ url_for('notes.detail', note_id=note['id']) }}">Cancel</a></p>
{% endblock %}
