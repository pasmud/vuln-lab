{% extends 'base.html' %}
{% block title %}{{ note['title'] }}{% endblock %}
{% block content %}
<p><a href="{{ url_for('notes.index') }}">Back to your notes</a></p>
<article>
  <h1>{{ note['title'] }}</h1>
  <p class="note-body">{{ note['body'] }}</p>
</article>
<p><a href="{{ url_for('notes.edit_note', note_id=note['id']) }}">Edit note</a></p>
<p><a href="{{ url_for('notes.confirm_delete', note_id=note['id']) }}">Delete note</a></p>
{% endblock %}
